<svg viewBox="0 50 1000 440" xmlns="http://www.w3.org/2000/svg">
  <style>
    <![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');
    ]]>
  </style>

    <defs>
      <marker id="arrowhead" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
      </marker>
    </defs>

    <!-- Quadrant Background Area (Top-Left Optimal Frontier) -->
    <rect x="80" y="60" width="440" height="230" fill="rgba(124,58,237,0.03)"/>

    <!-- Quadrant Violet Dashed Dividers -->
    <line x1="520" y1="60" x2="520" y2="420" stroke="rgba(124,58,237,0.25)" stroke-width="1.5" stroke-dasharray="8 8"/>
    <line x1="80" y1="290" x2="960" y2="290" stroke="rgba(124,58,237,0.25)" stroke-width="1.5" stroke-dasharray="8 8"/>

    <!-- X gridlines (Subtle vertical grid) -->
    <line x1="80" y1="60" x2="80" y2="420" stroke="rgba(15,23,42,0.06)" stroke-width="1"/>
    <text x="80" y="440" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b" text-anchor="middle">2.0M</text>

    <line x1="300" y1="60" x2="300" y2="420" stroke="rgba(15,23,42,0.06)" stroke-width="1"/>
    <text x="300" y="440" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b" text-anchor="middle">3.0M</text>

    <line x1="520" y1="60" x2="520" y2="420" stroke="rgba(15,23,42,0.06)" stroke-width="1"/>
    <text x="520" y="440" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b" text-anchor="middle">4.0M</text>


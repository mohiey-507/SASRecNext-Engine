    <text x="25" y="240" transform="rotate(-90 25,240)" font-family="'Geist', sans-serif" font-weight="600" font-size="12" fill="#0f172a" text-anchor="middle">NDCG@10 Score (Full-Ranking Test)</text>

    <!-- ARROWS -->
    <!-- SASRecNext Untied (819, 276) -> SASRecNext Tied (217, 91) -->
    <line x1="819" y1="276" x2="217" y2="91" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>

    <!-- SASRec Untied (717, 389) -> SASRec Tied (115, 199) -->
    <line x1="717" y1="389" x2="115" y2="199" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>

    <!-- LINE LABELS (With both % parameter reduction and NDCG@10 gain) -->
    <g transform="rotate(17.1, 518, 184)">
      <rect x="428" y="174" width="180" height="20" fill="#ffffff" rx="4" stroke="rgba(124,58,237,0.3)" stroke-width="0.8"/>
      <text x="518" y="188" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#6d28d9" text-anchor="middle">-51.0% Params (+3.5% NDCG@10)</text>
    </g>

    <g transform="rotate(17.5, 416, 294)">
      <rect x="326" y="284" width="180" height="20" fill="#ffffff" rx="4" stroke="rgba(124,58,237,0.3)" stroke-width="0.8"/>
      <text x="416" y="298" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#6d28d9" text-anchor="middle">-55.9% Params (+3.7% NDCG@10)</text>
    </g>

    <!-- POINTS & LABELS -->
    <!-- SASRecNext Untied (5.36M params, NDCG@10 = 0.2056) -->
    <circle cx="819" cy="276" r="19.5" fill="#ffffff"/>
    <circle cx="819" cy="276" r="19.5" fill="rgba(148,163,184,0.15)" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="754" y="240" width="130" height="16" fill="#ffffff" rx="3"/>
    <text x="819" y="252" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b" text-anchor="middle">SASRecNext (Untied)</text>

    <!-- SASRec Tied (2.16M params, NDCG@10 = 0.2086) -->
    <circle cx="115" cy="199" r="15" fill="#ffffff"/>
    <circle cx="115" cy="199" r="15" fill="rgba(59,130,246,0.12)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="65" y="218" width="100" height="14" fill="#ffffff"/>
    <text x="115" y="229" font-family="'Geist Mono', monospace" font-size="11" fill="#2563eb" font-weight="600" text-anchor="middle">SASRec (Tied)</text>

    <!-- SASRec Untied (4.89M params, NDCG@10 = 0.2012) -->
    <circle cx="717" cy="389" r="19.5" fill="#ffffff"/>
    <circle cx="717" cy="389" r="19.5" fill="rgba(148,163,184,0.15)" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="652" y="353" width="130" height="16" fill="#ffffff" rx="3"/>
    <text x="717" y="365" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b" text-anchor="middle">SASRec (Untied)</text>

    <!-- SASRecNext Tied (2.62M params, NDCG@10 = 0.2128) -->
    <circle cx="217" cy="91" r="15.5" fill="#ffffff"/>
    <circle cx="217" cy="91" r="15.5" fill="rgba(124,58,237,0.15)" stroke="#7c3aed" stroke-width="2"/>
    <rect x="152" y="58" width="130" height="14" fill="#ffffff"/>
    <text x="217" y="69" font-family="'Geist Mono', monospace" font-size="11" fill="#6d28d9" font-weight="700" text-anchor="middle">SASRecNext (Tied) ★</text>

  </svg>

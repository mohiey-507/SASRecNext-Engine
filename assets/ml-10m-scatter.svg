    <!-- ARROWS -->
    <!-- SASRecNext Untied (731, 315) -> SASRecNext Tied (250, 160) -->
    <line x1="731" y1="315" x2="250" y2="160" stroke="#eb6c36" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>

    <!-- SASRec Untied (719, 389) -> SASRec Tied (237, 199) -->
    <line x1="719" y1="389" x2="237" y2="199" stroke="#eb6c36" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>

    <!-- LINE LABELS (With both % parameter reduction and NDCG@10 gain) -->
    <g transform="rotate(17.8, 490, 237)">
      <rect x="400" y="227" width="180" height="20" fill="#faf7f2" rx="4" stroke="rgba(235,108,54,0.3)" stroke-width="0.8"/>
      <text x="490" y="241" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#eb6c36" text-anchor="middle">-35.5% Params (+2.9% NDCG@10)</text>
    </g>

    <g transform="rotate(21.5, 478, 294)">
      <rect x="388" y="284" width="180" height="20" fill="#faf7f2" rx="4" stroke="rgba(235,108,54,0.3)" stroke-width="0.8"/>
      <text x="478" y="298" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#eb6c36" text-anchor="middle">-35.9% Params (+3.7% NDCG@10)</text>
    </g>

    <!-- POINTS & LABELS -->
    <!-- SASRecNext Untied (7.70M params, NDCG@10 = 0.2041) -->
    <circle cx="731" cy="315" r="19.5" fill="#faf7f2"/>
    <circle cx="731" cy="315" r="19.5" fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1"/>
    <rect x="666" y="279" width="130" height="16" fill="#faf7f2" rx="3"/>
    <text x="731" y="291" font-family="'Geist Mono', monospace" font-size="10" fill="#4f5d75" text-anchor="middle">SASRecNext (Untied)</text>

    <!-- SASRec Tied (4.89M params, NDCG@10 = 0.2086) -->
    <circle cx="237" cy="199" r="15" fill="#faf7f2"/>
    <circle cx="237" cy="199" r="15" fill="rgba(235,108,54,0.15)" stroke="#eb6c36" stroke-width="1.5"/>

    <!-- SASRec Untied (7.63M params, NDCG@10 = 0.2012) -->
    <circle cx="719" cy="389" r="19.5" fill="#faf7f2"/>
    <circle cx="719" cy="389" r="19.5" fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1"/>
    <rect x="654" y="353" width="130" height="16" fill="#faf7f2" rx="3"/>
    <text x="719" y="365" font-family="'Geist Mono', monospace" font-size="10" fill="#4f5d75" text-anchor="middle">SASRec (Untied)</text>

    <!-- SASRecNext Tied (4.96M params, NDCG@10 = 0.2101) -->
    <circle cx="250" cy="160" r="15.5" fill="#faf7f2"/>
    <circle cx="250" cy="160" r="15.5" fill="rgba(16,185,129,0.20)" stroke="#10b981" stroke-width="1.8"/>
    <rect x="185" y="127" width="130" height="14" fill="#faf7f2"/>
    <text x="250" y="138" font-family="'Geist Mono', monospace" font-size="11" fill="#047857" font-weight="700" text-anchor="middle">SASRecNext (Tied) ★</text>

  </svg>

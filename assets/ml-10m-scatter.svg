    <text x="740" y="440" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b" text-anchor="middle">5.0M</text>

    <line x1="960" y1="60" x2="960" y2="420" stroke="rgba(15,23,42,0.06)" stroke-width="1"/>
    <text x="960" y="440" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b" text-anchor="middle">6.0M</text>


    <line x1="80" y1="369" x2="960" y2="369" stroke="rgba(15,23,42,0.06)" stroke-width="1"/>
    <text x="65" y="372" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b" text-anchor="end">0.202</text>

    <line x1="80" y1="317" x2="960" y2="317" stroke="rgba(15,23,42,0.06)" stroke-width="1"/>
    <text x="65" y="320" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b" text-anchor="end">0.204</text>

    <line x1="80" y1="266" x2="960" y2="266" stroke="rgba(15,23,42,0.06)" stroke-width="1"/>

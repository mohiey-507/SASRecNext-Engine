<svg viewBox="0 50 1000 440" xmlns="http://www.w3.org/2000/svg">
  <style>
    <![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');
    ]]>
  </style>

    <defs>
      <marker id="arrowhead" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6c36"/>
      </marker>
    </defs>

    <!-- Quadrant Background Area (Top-Left Holy Grail) -->
    <rect x="80" y="60" width="440" height="230" fill="rgba(16,185,129,0.035)"/>

    <!-- Quadrant Green Dashed Dividers -->
    <line x1="520" y1="60" x2="520" y2="420" stroke="rgba(16,185,129,0.35)" stroke-width="1.5" stroke-dasharray="8 8"/>

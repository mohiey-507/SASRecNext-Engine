    <line x1="74" y1="369" x2="80" y2="369" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="74" y1="317" x2="80" y2="317" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="74" y1="266" x2="80" y2="266" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="74" y1="214" x2="80" y2="214" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="74" y1="163" x2="80" y2="163" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="74" y1="111" x2="80" y2="111" stroke="#0f172a" stroke-width="1.2"/>

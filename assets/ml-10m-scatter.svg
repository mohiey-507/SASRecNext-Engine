    <line x1="784" y1="420" x2="784" y2="426" stroke="#1c1917" stroke-width="1.2"/>
    <line x1="960" y1="420" x2="960" y2="426" stroke="#1c1917" stroke-width="1.2"/>

    <!-- Y Axis Title -->

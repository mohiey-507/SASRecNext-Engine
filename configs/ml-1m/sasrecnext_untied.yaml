runtime:
  device: auto
  enable_amp: true
  compile_model: true
  seed: 2026
  show_progress: true
  n_workers: 0

training:
  epochs: 50
  learning_rate: 8.438e-04
  weight_decay: 4.381e-05
  train_batch_size: 64
  eval_batch_size: 128
  stride: 150
  early_stopping: 20
  lr_decay_factor: 0.966

model:
  model_type: SASRecNext
  tied_weights: false
  d_model: 128
  n_heads: 2
  n_layers: 3
  max_seq_len: 200
  attn_dropout: 0.0
  ffn_dim: 384
  ffn_dropout: 0.101
  embedding_dropout: 0.101

evaluation:
  mode: full
  top_k: [10, 20, 50, 200]
  metrics: [recall, ndcg, mrr]
  valid_metric: mrr@10

data:
  dataset: ml-1m
  train_seq_mode: "sliding_window"
